<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 360" width="512" height="360" role="img" aria-label="Lenvry logo">
  <defs>
    <linearGradient id="ln-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161922"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="ln-l" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="ln-glow" cx="0.5" cy="0.52" r="0.72">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#6366F1" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- mark -->
  <g transform="translate(156 8) scale(0.390625)">
